# UBAA Android APK CI/CD
# Builds release APK from the ubaa/ subdirectory (KMP project), signed via GitHub Secrets.

name: Build UBAA Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ubaa/**'
      - '.github/workflows/ubaa-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ubaa

      - name: Grant execute permission
        run: chmod +x gradlew
        working-directory: ubaa

      - name: Recreate signing keystore from secret
        shell: bash
        run: |
          if [ -z "${{ secrets.SIGNING_KEY }}" ]; then
            echo "::error::SIGNING_KEY secret 未配置，无法签名 release。请在仓库 Secrets 添加 SIGNING_KEY(基64的 keystore)。"
            exit 1
          fi
          mkdir -p keystore
          # 去除 secret 中可能含有的换行，再 base64 解码
          echo "${{ secrets.SIGNING_KEY }}" | tr -d '\n' | base64 -d > keystore/release.p12
          echo "SIGNING_KEY=$GITHUB_WORKSPACE/ubaa/keystore/release.p12" >> $GITHUB_ENV
        working-directory: ubaa

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease :androidApp:assembleDebug --stacktrace --no-daemon
        working-directory: ubaa

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ubaa-release
          path: ubaa/androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK (unsigned, for WebContentsDebugging/chrome://inspect debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubaa-debug
          path: ubaa/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
