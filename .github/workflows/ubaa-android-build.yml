# UBAA Android APK CI/CD
# Builds debug & release APK from the ubaa/ subdirectory (KMP project)

name: Build UBAA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ubaa

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug
        working-directory: ubaa

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ubaa-debug
          path: ubaa/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14
